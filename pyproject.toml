[build-system]
# setuptools>=77 for PEP 639 (SPDX `license` string + `license-files`).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bg3dtools"
version = "1.0.2"
description = "Scientific computing toolkit for 3D geometry processing, computer vision, and human pose landmarking"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Benjamin Groisser", email = "bgroisser@gmail.com"}]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "libigl==2.5.1",
    "Pillow",
    "imageio",
]

[project.optional-dependencies]
mesh   = ["trimesh", "plyfile", "triangle"]
learn  = ["scikit-learn"]
torch  = ["torch"]
vision = ["opencv-python", "mediapipe"]
viz    = ["open3d", "matplotlib"]
graph  = ["igraph"]
io     = ["tenacity"]
# Opt-in: the functional-map solver (FunctionalMapper.mesh_correspondence ->
# spectral_functional) uses jax for JIT/autodiff. jax is imported lazily, so this
# extra is only needed to actually run that solver. CPU jaxlib; pinned to the
# 0.4.x line the code was developed against (0.4.18 is the earliest PyPI release;
# the original 0.4.16 was an unpublished nightly).
match  = ["jax[cpu]>=0.4.18,<0.5"]
all = [
    "bg3dtools[mesh,learn,torch,vision,viz,graph,io,match]",
]

[tool.setuptools.packages.find]
include = ["bg3dtools*", "spectral_match*"]

[project.urls]
Homepage = "https://github.com/groisserb-hss/bg3dtools"

[tool.setuptools.package-data]
# Scoped deliberately: a bare "**/*.npy" swept up 9.2 MB of unreferenced debug
# dumps in mesh/ and shipped them in every wheel. smpl_2_blaze.npy (loaded by
# pose_landmarking.joint_mapper) is the only .npy the package actually needs.
bg3dtools = ["pose_landmarking/*.npy", "pose_landmarking/resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
